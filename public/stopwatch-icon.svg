<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="110" r="70" fill="#1B4F72" stroke="#1B4F72" stroke-width="8"/>
  <circle cx="100" cy="110" r="55" fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Clock ticks -->
  <line x1="100" y1="60" x2="100" y2="68" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="75" x2="130" y2="82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="110" x2="142" y2="110" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="145" x2="130" y2="138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="160" x2="100" y2="152" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="145" x2="70" y2="138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="110" x2="58" y2="110" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="70" y2="82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Hour hand -->
  <line x1="100" y1="110" x2="120" y2="85" stroke="#1B4F72" stroke-width="6" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="100" cy="110" r="5" fill="#1B4F72"/>

  <!-- Button indicators at bottom -->
  <rect x="90" y="140" width="20" height="6" rx="3" fill="#1B4F72"/>

  <!-- Top button -->
  <rect x="90" y="25" width="20" height="12" rx="6" fill="#1B4F72"/>
</svg>
